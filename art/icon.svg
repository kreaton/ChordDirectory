<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chord Directory icon: five piano keys (C to G) with a C major chord marked the way the app marks it:
       the root in coral, the other chord tones in gold, on the app's dark background. Drawn by hand as plain
       shapes. The keys sit inside the maskable safe zone (a circle of 40 % radius), so the same picture is
       used for the maskable icon. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#2a3346" />
      <stop offset=".6" stop-color="#161b26" />
      <stop offset="1" stop-color="#0e1118" />
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e9e4d8" />
    </linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e38" />
      <stop offset="1" stop-color="#121319" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".5" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />

  <g filter="url(#shadow)">
    <!-- white keys C D E F G -->
    <g fill="url(#ivory)" stroke="#0e1118" stroke-width="8">
      <rect x="252" y="300" width="104" height="420" rx="14" />
      <rect x="356" y="300" width="104" height="420" rx="14" />
      <rect x="460" y="300" width="104" height="420" rx="14" />
      <rect x="564" y="300" width="104" height="420" rx="14" />
      <rect x="668" y="300" width="104" height="420" rx="14" />
    </g>
    <!-- black keys C♯ D♯ F♯ -->
    <g fill="url(#ebony)" stroke="#0e1118" stroke-width="6">
      <rect x="322" y="296" width="68" height="252" rx="10" />
      <rect x="426" y="296" width="68" height="252" rx="10" />
      <rect x="634" y="296" width="68" height="252" rx="10" />
    </g>
  </g>

  <!-- C major: C (root), E, G -->
  <circle cx="304" cy="640" r="36" fill="#ff7b5c" />
  <circle cx="512" cy="640" r="36" fill="#f4b740" />
  <circle cx="720" cy="640" r="36" fill="#f4b740" />
</svg>
